; Heart/lung band-split firmware -- seven environments off one shared core
; (see pipeline.md for the flow charts):
;
;   native      x86 host build. Diffs lib/hls_filter against scipy's golden
;               vectors (firmware/golden/) so coefficient and state bugs are
;               caught on the server, before any board is wired up.
;   nano33ble   Arduino Nano 33 BLE Sense, onboard PDM mic, CMSIS-DSP biquads.
;   esp32s3     ESP32-S3, external I2S mic, ESP-DSP biquads.
;   *-selftest  same boards, running the golden-vector check instead of a
;               pipeline -- this is what verifies the CMSIS-DSP / ESP-DSP
;               kernels against scipy once hardware is actually available.
;   *-bench     same boards, replaying real HLS-CMDS mixtures compiled into
;               flash. No microphone: the samples are bit-identical to the ones
;               the Python baseline filters, so the output can be diffed against
;               scipy exactly and scored with the same BSS Eval metrics.
;               Needs `make firmware-clips` first (generates hls_clips.h).
;
; Board envs are build-only here (no hardware attached to the server); upload
; with `pio run -e <env> -t upload` once a board is connected.

[platformio]
default_envs = native
src_dir = src
lib_dir = lib

[env]
build_flags = -Wall -Wextra

[env:native]
platform = native
build_src_filter = +<main_native.c>
build_flags = ${env.build_flags} -std=c11 -O2 -lm

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
build_src_filter = +<main_nano33ble.cpp>
; ARM_MATH_CM4/__FPU_PRESENT pick the Cortex-M4F kernels inside CMSIS-DSP.
build_flags =
    ${env.build_flags}
    -DHLS_FILTER_BACKEND_CMSIS
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1
platform_packages = platformio/framework-cmsis-dsp@^1.17.1
extra_scripts = pre:tools/cmsis_dsp.py

[env:nano33ble-selftest]
extends = env:nano33ble
build_src_filter = +<main_selftest.cpp>

[env:nano33ble-bench]
extends = env:nano33ble
build_src_filter = +<main_bench.cpp>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main_esp32s3.cpp>
; esp-dsp ships inside the arduino-esp32 SDK -- headers and -lespressif__esp-dsp
; are already on the build flags, so no lib_deps entry is needed.
build_flags =
    ${env.build_flags}
    -DHLS_FILTER_BACKEND_ESPDSP
monitor_speed = 115200

[env:esp32s3-selftest]
extends = env:esp32s3
build_src_filter = +<main_selftest.cpp>

[env:esp32s3-bench]
extends = env:esp32s3
build_src_filter = +<main_bench.cpp>
